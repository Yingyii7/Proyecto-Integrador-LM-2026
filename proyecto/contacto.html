<!DOCTYPE html>
<!--Fecha: 24 de noviembre - Nombre: Yingyi Li Pan--> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | CineVibe</title>
    <meta name="description" content="Descubre series y peliculas para todos los gustos. ¡Encuentra tu proxima obsesion y vibra con cada historia!">
    <meta name="keywords" content="Capitulos, risas, picoteo, diversion">
    <meta name="author" content="Yingyii7">
</head>

<body>
    
    <!--Cabecera-->
    <header>
      <p><strong>CineVibe</strong></p>
      <nav>
        <a href="index.html">Inicio</a>
        <a href="contacto.html">Ir a contactos</a>
        <a href="datos.xml">Especificaciones</a>
      </nav>
    </header>

    <main>
        <section id="contacto">
            <h1>contacto</h1>

            <form action="#" method="post">

                <!--Datos personales-->
                <fieldset>
                    <legend>Tus datos</legend>
                    <p>
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="50" placeholder="Nombre Apellido" autofocus>
                    </p>

                    <p>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required placeholder="tu@email.com" maxlength="50">
                    </p>

                    <p>
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" required placeholder="xxxxxxxxx">
                    </p>

                    <p>
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad">
                    </p>
                </fieldset>

                <!--Consulta-->
                <fieldset>
                    <legend>Tu consulta</legend>
                    <p>
                        <!-- el <br> es para salto de línea-->
                        <label for="tu-serie-favorita">Serie favorita:</label><br>

                        <select id="tu-serie-favorita" name="serie_favorita">
                            <option value="">--Selecciona una serie--</option>
                            <option value="Off-campus">Off-campus</option>
                            <option value="summer-pretty">The Summer I Turn Pretty</option>
                            <option value="la-timonel">La timonel</option>
                            <option value="otra">Otra</option>
                        </select>
                    </p>
                    
                    <p>
                        <span>Plataforma que utilizas:</span><br>

                        <input type="checkbox" id="plat-netflix" name="plataforma" value="Netflix">
                        <label for="plat-netflix">Netflix</label>

                        <input type="checkbox" id="plat-prime" name="plataforma" value="Amazon Prime">
                        <label for="plat-prime">Amazon Prime</label>

                        <input type="checkbox" id="plat-hbo" name="plataforma" value="HBO">
                        <label for="plat-hbo">HBO</label>
                    </p>

                    <p>
                        <span>¿Qué opinas del catálogo actual?</span><br>

                        <input type="radio" id="opinion-genial" name="opinion" value="Genial">
                        <label for="opinion-genial">Genial</label>

                        <input type="radio" id="opinion-bien" name="opinion" value="Bien">
                        <label for="opinion-bien">Bien</label>

                        <input type="radio" id="opinion-malo" name="opinion" value="Malo">
                        <label for="opinion-malo">Malo</label>
                    </p>

                    <p>
                        <span>Comentario:</span><br>
                        <textarea id="comentario" name="comentario" rows="4" maxlength="200"></textarea>
                    </p>
                </fieldset>

                <p class="boton">
                    <button type="submit">Enviar</button>
                    <button type="reset">Borrar datos</button>
                </p>

            </form>
        </section>
    </main>
    
    <!-- Pie de pagina -->
    <footer>
        <p id="firma-Yingyii7">&copy; 2026 Yingyii7</p>
    </footer>

</body>
</html>
